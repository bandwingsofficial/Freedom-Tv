
<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom TV - Kannada News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@100..800&family=Hubballi&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Anek Kannada', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Creative Header Font */
        .kannada-font {
            font-family: 'Hubballi', 'Anek Kannada', cursive;
            letter-spacing: 0.02em;
        }

        /* Highly Optimized Editorial Reading Font for long-form content */
        .kannada-readable {
            font-family: 'Anek Kannada', sans-serif;
            font-weight: 400;
            /* Kannada glyphs need significantly more vertical space for clear rendering of ottus */
            line-height: 2.15; 
            letter-spacing: 0.015em;
            word-spacing: 0.08em;
            font-size: 1.2rem;
            color: #1a1a1a;
        }

        .article-body p {
            margin-bottom: 2.5rem; /* Spacious paragraph separation */
        }

        .article-body strong {
            font-weight: 700;
            color: #000;
        }

        h1, h2, h3, .headline-font {
            font-family: 'Hubballi', 'Anek Kannada', cursive;
        }

        @media (max-width: 640px) {
            .kannada-readable {
                line-height: 1.95;
                font-size: 1.125rem;
                letter-spacing: 0.01em;
            }
            .article-body p {
                margin-bottom: 1.75rem;
            }
        }

        /* Line length optimization: 70-80 chars is ideal for reading */
        .reading-container {
            max-width: 760px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Smooth transitions for navigation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #b91c1c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #991b1b;
        }
    </style>
<script type="importmap">

</head>

</body>
</html>
